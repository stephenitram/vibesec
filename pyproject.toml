[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesec"
version = "0.1.0"
description = "Offline, privacy-preserving Git Pre-Commit Hook CLI tool with Ollama LLM security auditing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DevSecOps Team", email = "secops@vibesec.local" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gitpython>=3.1.40",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
vibesec = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
